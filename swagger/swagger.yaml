        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_gambitier_golang-service-template_internal_presentation_http_response.Envelope'
      summary: List items
      tags:
      - items
    post:
      consumes:
      - application/json
      description: Create a new item
      parameters:
      - description: Item payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_presentation_http_handlers_item.CreateItemRequest'
