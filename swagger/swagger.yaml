      description: Delete an item by ID
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_gambitier_golang-service-template_internal_presentation_http_response.Envelope'
      summary: Delete item
      tags:
      - items
    get:
      description: Fetch a single item
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_gambitier_golang-service-template_internal_presentation_http_response.Envelope'
